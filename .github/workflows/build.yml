name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Секрети KEYSTORE_BASE64 / KEYSTORE_PASSWORD не задані — APK підписано тимчасовим ключем, оновлення поверх старої версії може не встановитися."
          fi
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk LockTime.apk

      # Відбиток сертифіката, яким підписано APK (публічна інформація, не секрет).
      # За ним можна перевірити, що APK зібрано саме з цього репозиторію.
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs LockTime.apk | grep -E "SHA-256|DN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LockTime-apk
          path: LockTime.apk

      # Кожна збірка з main публікується як реліз — APK зручно качати з телефона:
      # https://github.com/<user>/<repo>/releases/latest/download/LockTime.apk
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LockTime 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Завантажте LockTime.apk нижче і встановіть на телефон.
          files: LockTime.apk
