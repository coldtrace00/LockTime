name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LockTime.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LockTime-apk
          path: LockTime.apk

      # Кожна збірка з main публікується як реліз — APK зручно качати з телефона:
      # https://github.com/<user>/<repo>/releases/latest/download/LockTime.apk
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LockTime 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Завантажте LockTime.apk нижче і встановіть на телефон.
          files: LockTime.apk
